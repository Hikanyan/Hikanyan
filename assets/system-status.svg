<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
  <title id="title">HIKANYAN system telemetry</title>
  <desc id="desc">Self-hosted GitHub telemetry generated by GitHub Actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/><stop offset="100%" stop-color="#160d25"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7ff"/><stop offset="50%" stop-color="#8a7dff"/><stop offset="100%" stop-color="#ff63d8"/>
    </linearGradient>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1000" height="180" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="178" rx="21" fill="none" stroke="#79eaff" stroke-opacity=".18"/>
  <text x="42" y="44" class="m" fill="#6de8ff" font-size="15" letter-spacing="2">SYSTEM TELEMETRY // SELF-HOSTED</text>
  <rect x="42" y="62" width="916" height="2" fill="url(#g)" opacity=".8"/>
  <text x="500" y="116" text-anchor="middle" class="s" fill="#f6fbff" font-size="24" font-weight="700">TELEMETRY INITIALIZING</text>
  <text x="500" y="146" text-anchor="middle" class="m" fill="#8fa3bd" font-size="14">GitHub Actions will refresh this panel automatically.</text>
</svg>