<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">HIKANYAN GitHub system telemetry</title>
  <desc id="desc">Self-hosted GitHub telemetry generated from the GitHub API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#160d25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="50%" stop-color="#8a7dff"/>
      <stop offset="100%" stop-color="#ff63d8"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1000" height="330" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="328" rx="21"
        fill="none" stroke="#79eaff" stroke-opacity=".18"/>
  <text x="42" y="38" class="mono" fill="#6de8ff"
        font-size="15" letter-spacing="2">SYSTEM TELEMETRY // GITHUB API</text>
  <text x="958" y="38" text-anchor="end" class="mono"
        fill="#8fa3bd" font-size="12">2026-10-09 15:03 JST</text>
  <rect x="42" y="54" width="916" height="2" fill="url(#accent)" opacity=".82"/>
  
    <g transform="translate(42 78)">
      <rect width="292" height="92" rx="16"
            fill="#ffffff" fill-opacity=".045"
            stroke="#7eeaff" stroke-opacity=".16"/>
      <text x="20" y="30" class="mono" fill="#8fa3bd"
            font-size="12" letter-spacing="1.5">REPOSITORIES</text>
      <text x="20" y="66" class="sans" fill="#f6fbff"
            font-size="26" font-weight="700">82</text>
    </g>
    
    <g transform="translate(354 78)">
      <rect width="292" height="92" rx="16"
            fill="#ffffff" fill-opacity=".045"
            stroke="#7eeaff" stroke-opacity=".16"/>
      <text x="20" y="30" class="mono" fill="#8fa3bd"
            font-size="12" letter-spacing="1.5">ACTIVE / 30D</text>
      <text x="20" y="66" class="sans" fill="#f6fbff"
            font-size="26" font-weight="700">2</text>
    </g>
    
    <g transform="translate(666 78)">
      <rect width="292" height="92" rx="16"
            fill="#ffffff" fill-opacity=".045"
            stroke="#7eeaff" stroke-opacity=".16"/>
      <text x="20" y="30" class="mono" fill="#8fa3bd"
            font-size="12" letter-spacing="1.5">TOTAL STARS</text>
      <text x="20" y="66" class="sans" fill="#f6fbff"
            font-size="26" font-weight="700">8</text>
    </g>
    
    <g transform="translate(42 188)">
      <rect width="292" height="92" rx="16"
            fill="#ffffff" fill-opacity=".045"
            stroke="#7eeaff" stroke-opacity=".16"/>
      <text x="20" y="30" class="mono" fill="#8fa3bd"
            font-size="12" letter-spacing="1.5">TOTAL FORKS</text>
      <text x="20" y="66" class="sans" fill="#f6fbff"
            font-size="26" font-weight="700">0</text>
    </g>
    
    <g transform="translate(354 188)">
      <rect width="292" height="92" rx="16"
            fill="#ffffff" fill-opacity=".045"
            stroke="#7eeaff" stroke-opacity=".16"/>
      <text x="20" y="30" class="mono" fill="#8fa3bd"
            font-size="12" letter-spacing="1.5">FOLLOWERS</text>
      <text x="20" y="66" class="sans" fill="#f6fbff"
            font-size="26" font-weight="700">30</text>
    </g>
    
    <g transform="translate(666 188)">
      <rect width="292" height="92" rx="16"
            fill="#ffffff" fill-opacity=".045"
            stroke="#7eeaff" stroke-opacity=".16"/>
      <text x="20" y="30" class="mono" fill="#8fa3bd"
            font-size="12" letter-spacing="1.5">PRIMARY LANG</text>
      <text x="20" y="66" class="sans" fill="#f6fbff"
            font-size="26" font-weight="700">C#</text>
    </g>
    
  <text x="500" y="310" text-anchor="middle" class="mono"
        fill="#8fa3bd" font-size="11" letter-spacing="2">
