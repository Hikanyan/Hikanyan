<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="92" viewBox="0 0 1000 92" role="img" aria-label="Animated system signal">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="50%" stop-color="#8a7dff"/>
      <stop offset="100%" stop-color="#ff63d8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="92" rx="18" fill="#0b1020"/>
  <path d="M28 46h944" stroke="#7eeaff" stroke-opacity=".12"/>
  <path d="M38 46h170l18-18 24 36 24-24 18 6h420l18-20 24 40 24-28 20 8h154"
