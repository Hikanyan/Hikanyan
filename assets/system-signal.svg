  <circle cx="38" cy="46" r="5" fill="#5ee7ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="962" cy="46" r="5" fill="#ff63d8" filter="url(#glow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <rect x="-160" y="10" width="140" height="72" rx="14" fill="url(#g)" opacity=".08">
    <animate attributeName="x" from="-160" to="1020" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="488" y="14" width="24" height="64" rx="12" fill="#8a7dff" opacity=".08">
    <animate attributeName="opacity" values=".05;.22;.05" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>