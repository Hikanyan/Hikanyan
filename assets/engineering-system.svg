<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
  <title id="title">HIKANYAN Engineering System</title>
  <desc id="desc">Futuristic engineering console profile for game development, technical art, tools, infrastructure and automation.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="45%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#160d25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="50%" stop-color="#8a7dff"/>
      <stop offset="100%" stop-color="#ff63d8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7eeaff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.018"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .muted { fill: #8fa3bd; }
      .white { fill: #f6fbff; }
      .cyan { fill: #6de8ff; }
      .purple { fill: #a791ff; }
      .pink { fill: #ff7bdd; }
      .line { stroke: #7eeaff; stroke-opacity: .28; }
    </style>
  </defs>

  <rect width="1200" height="1080" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="1080" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="1080" rx="28" fill="url(#scan)"/>

  <path d="M0 105 L190 0 H0 Z" fill="#64e9ff" opacity=".08"/>
  <path d="M1200 0 H990 L1200 150 Z" fill="#ff63d8" opacity=".07"/>
  <path d="M0 930 L210 1080 H0 Z" fill="#8a7dff" opacity=".06"/>

  <g opacity=".85">
    <path d="M46 58h110" stroke="#65e9ff" stroke-width="3"/>
    <path d="M1044 58h110" stroke="#ff6ddb" stroke-width="3"/>
    <circle cx="46" cy="58" r="5" fill="#65e9ff" filter="url(#glow)"/>
    <circle cx="1154" cy="58" r="5" fill="#ff6ddb" filter="url(#glow)"/>
  </g>

  <text x="600" y="98" text-anchor="middle" class="mono muted" font-size="18" letter-spacing="5">HIKANYAN // ENGINEERING SYSTEM</text>
  <text x="600" y="190" text-anchor="middle" class="sans white" font-size="86" font-weight="800" letter-spacing="8">HIKANYAN</text>
  <rect x="282" y="216" width="636" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
  <text x="600" y="262" text-anchor="middle" class="mono cyan" font-size="20" letter-spacing="3">GAME DEVELOPMENT / TECHNICAL ART / ENGINEERING</text>

  <g transform="translate(205 302)">
    <rect width="790" height="54" rx="27" fill="#ffffff" opacity=".055" stroke="#8deeff" stroke-opacity=".18"/>
    <circle cx="37" cy="27" r="7" fill="#62f5a7" filter="url(#glow)"/>
    <text x="58" y="34" class="mono white" font-size="16">SYSTEM : ONLINE</text>
    <text x="292" y="34" class="mono muted" font-size="16">MODE : BUILDING</text>
    <text x="523" y="34" class="mono muted" font-size="16">REGION : JAPAN</text>
  </g>

  <text x="90" y="430" class="mono cyan" font-size="16" letter-spacing="3">01 // IDENTITY</text>
  <line x1="90" y1="448" x2="1110" y2="448" class="line"/>
  <text x="90" y="498" class="sans white" font-size="34" font-weight="700">Building systems beyond the screen.</text>
  <text x="90" y="535" class="sans muted" font-size="20">Games · Tools · Infrastructure · Automation</text>

  <g transform="translate(90 580)">
    <rect width="1020" height="190" rx="22" fill="url(#panel)" stroke="#9cefff" stroke-opacity=".16"/>
    <text x="34" y="46" class="mono muted" font-size="14" letter-spacing="2">02 // TECHNOLOGY MATRIX</text>

    <g class="mono" font-size="19" font-weight="700">
      <rect x="34" y="72" width="116" height="48" rx="12" fill="#5ee7ff" opacity=".09" stroke="#5ee7ff" stroke-opacity=".35"/>
      <text x="92" y="103" text-anchor="middle" class="cyan">UNITY</text>

      <rect x="164" y="72" width="96" height="48" rx="12" fill="#8a7dff" opacity=".09" stroke="#8a7dff" stroke-opacity=".35"/>
      <text x="212" y="103" text-anchor="middle" class="purple">C#</text>

      <rect x="274" y="72" width="96" height="48" rx="12" fill="#8a7dff" opacity=".09" stroke="#8a7dff" stroke-opacity=".35"/>
      <text x="322" y="103" text-anchor="middle" class="purple">C++</text>

      <rect x="384" y="72" width="130" height="48" rx="12" fill="#5ee7ff" opacity=".09" stroke="#5ee7ff" stroke-opacity=".35"/>
      <text x="449" y="103" text-anchor="middle" class="cyan">PYTHON</text>

      <rect x="528" y="72" width="112" height="48" rx="12" fill="#ff63d8" opacity=".08" stroke="#ff63d8" stroke-opacity=".3"/>
      <text x="584" y="103" text-anchor="middle" class="pink">AWS</text>

      <rect x="654" y="72" width="166" height="48" rx="12" fill="#ff63d8" opacity=".08" stroke="#ff63d8" stroke-opacity=".3"/>
      <text x="737" y="103" text-anchor="middle" class="pink">FIREBASE</text>

      <rect x="834" y="72" width="152" height="48" rx="12" fill="#5ee7ff" opacity=".09" stroke="#5ee7ff" stroke-opacity=".35"/>
      <text x="910" y="103" text-anchor="middle" class="cyan">CI / CD</text>
    </g>

    <text x="34" y="158" class="mono muted" font-size="16">GAME SYSTEMS  /  TOOLS  /  AUTOMATION  /  INFRASTRUCTURE</text>
  </g>

  <text x="90" y="838" class="mono purple" font-size="16" letter-spacing="3">03 // ENGINEERING DIRECTIVES</text>
  <line x1="90" y1="856" x2="1110" y2="856" class="line"/>

  <g class="mono" font-size="18">
    <text x="110" y="906" class="cyan">01</text><text x="165" y="906" class="white">BUILD</text><text x="310" y="906" class="muted">Turn ideas into systems.</text>
    <text x="110" y="946" class="purple">02</text><text x="165" y="946" class="white">AUTOMATE</text><text x="310" y="946" class="muted">Eliminate repetition.</text>
    <text x="650" y="906" class="pink">03</text><text x="705" y="906" class="white">OPTIMIZE</text><text x="860" y="906" class="muted">Make systems better.</text>
    <text x="650" y="946" class="cyan">04</text><text x="705" y="946" class="white">ITERATE</text><text x="860" y="946" class="muted">Never stop improving.</text>
  </g>

  <rect x="90" y="988" width="1020" height="2" fill="url(#accent)" opacity=".85"/>
  <text x="600" y="1028" text-anchor="middle" class="sans white" font-size="24" font-weight="700" letter-spacing="3">ENGINEER THE EXPERIENCE.</text>
  <text x="600" y="1056" text-anchor="middle" class="mono muted" font-size="13" letter-spacing="3">BUILD WHAT DOESN'T EXIST // END OF TRANSMISSION</text>
</svg>